[project]
name = "llm-service"
version = "0.1.0"
description = "LLM 接入层：多 provider、可降级、能报成本 —— 6 周冲刺 W1 项目"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "httpx>=0.28",
    "numpy>=2.0",
    # MCP Server（mcp_server/）。注意 2.x 把 FastMCP 改名成了 MCPServer，
    # 锁 >=2.0 是为了避免有人装到 1.x 后照 2.x 的写法 import 失败。
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
